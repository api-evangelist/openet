name: Openet
description: >-
  Openet was an Irish telecommunications software company (headquartered in
  Dublin) that built real-time business support systems (BSS) for mobile network
  operators, including online charging systems, real-time policy and charging
  control, digital business platforms, and data management for 4G/5G monetization.
  Openet was acquired by Amdocs in 2020 and its brand and products were absorbed
  into the Amdocs monetization portfolio; the openet.com domain now redirects to
  the Amdocs monetization product pages. There is no independent Openet developer
  portal, public API, or first-party SDK surface remaining. This profile was
  surfaced as a portfolio-graph lead from balderton-capital and processed by the
  enrichment pipeline, which confirmed the acquisition/redirect and found no
  live API artifacts to harvest.
